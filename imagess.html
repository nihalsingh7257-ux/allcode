<!DOCTYPE html>
<html>
<head>
    <title>My Image Gallery</title>

    <style>
        ul {
            display: flex;
            gap: 20px;
            list-style: none;
            padding: 0;
        }

        li img {
            width: 400px;
            height: 400px;
            object-fit: cover;
        }
    </style>
</head>

<body>

    <h1>My Image Gallery</h1>

    <ul>
        <li><img src="dhanda.jpg.jfif" alt="Dhanda"></li>
        <li><img src="arminder.jpg.jfif" alt="Arminder"></li>
        <li><img src="honeysingh.jpg.jfif" alt="Honey Singh"></li>
    </ul>

</body>
</html>
